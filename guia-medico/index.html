<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00875a">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guia Médico">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Guia Médico Fácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================ TOKENS ============================ */
:root{
  --green:#00875a; --green-deep:#00674433; --green-ink:#00553a; --green-btn:#0a7d55;
  --green-soft:#e4f2ec; --green-line:#bfe0d3;
  --bg:#f4f6f3; --surface:#ffffff; --ink:#16221d; --muted:#5c6b64; --faint:#8b9791;
  --line:#e3e8e4; --line-strong:#d2dad5;
  --amber:#9a5b00; --amber-soft:#fbeecf; --amber-line:#f0d69a;
  --teal:#0f6d76; --teal-soft:#dcf0f1;
  --wa:#0a7d55;
  --shadow-card:0 1px 2px rgba(18,40,32,.04), 0 4px 16px rgba(18,40,32,.05);
  --shadow-sheet:0 -8px 40px rgba(10,30,22,.18);
  --r:18px; --r-sm:12px; --r-pill:999px;
  --sans:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; line-height:1.45;
  overscroll-behavior-y:none;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:16px}
::selection{background:var(--green-soft)}
:focus-visible{outline:3px solid var(--green); outline-offset:2px; border-radius:6px}

/* ============================ APP SHELL ============================ */
.app{max-width:560px; margin:0 auto; min-height:100dvh; position:relative}

/* atmosphere: soft top wash + faint medical cross grid */
.app::before{
  content:""; position:fixed; inset:0 0 auto 0; height:340px; z-index:-1;
  background:
    radial-gradient(120% 90% at 50% -10%, #eaf5ef 0%, rgba(234,245,239,0) 62%),
    linear-gradient(180deg,#eef6f1,var(--bg));
}

/* ---------------- HEADER ---------------- */
header{position:sticky; top:0; z-index:20; padding:max(14px,env(safe-area-inset-top)) 18px 12px;
  background:linear-gradient(180deg, rgba(244,246,243,.98), rgba(244,246,243,.86));
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid transparent;
  transition:border-color .2s, box-shadow .2s;}
header.scrolled{border-color:var(--line); box-shadow:0 4px 20px rgba(18,40,32,.05)}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.mark{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:conic-gradient(from 210deg,#00a06a,#00875a,#00674a); color:#fff; box-shadow:0 4px 12px #00674a33}
.mark svg{width:19px;height:19px}
.brand h1{font-family:var(--serif); font-optical-sizing:auto; font-weight:600; font-size:22px;
  letter-spacing:-.01em; margin:0; line-height:1}
.brand .sub{font-size:12.5px; color:var(--muted); margin-top:3px; font-weight:500}
.brand .sub b{color:var(--green-ink); font-weight:600}

/* search */
.search{position:relative; display:flex; align-items:center}
.search svg.lupa{position:absolute; left:15px; width:19px;height:19px; color:var(--faint); pointer-events:none}
#q{width:100%; height:52px; border:1.5px solid var(--line-strong); background:var(--surface);
  border-radius:var(--r-pill); padding:0 46px 0 44px; font-size:16px; color:var(--ink);
  box-shadow:var(--shadow-card); transition:border-color .18s, box-shadow .18s}
#q::placeholder{color:var(--faint)}
#q:focus{border-color:var(--green); box-shadow:0 0 0 4px var(--green-soft)}
.clearq{position:absolute; right:8px; width:36px;height:36px;border:0;background:transparent;border-radius:50%;
  color:var(--muted); display:none; place-items:center; font-size:20px}
.clearq.show{display:grid}
.clearq:hover{background:var(--green-soft); color:var(--green-ink)}

/* ---------------- FILTERS ---------------- */
.filters{padding:12px 0 0}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 18px 2px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:38px; padding:0 15px; border-radius:var(--r-pill); border:1.5px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-size:14px; font-weight:600; white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px; transition:transform .1s var(--ease), background .15s, border-color .15s, color .15s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--green); border-color:var(--green); color:#fff}
.chip.more{border-style:dashed; color:var(--green-ink)}
.rowtools{display:flex; gap:10px; align-items:center; padding:12px 18px 4px}
.selwrap{position:relative; flex:1}
.selwrap svg{position:absolute; right:12px; top:50%; transform:translateY(-50%); width:16px;height:16px; color:var(--muted); pointer-events:none}
#city{appearance:none; width:100%; height:46px; border:1.5px solid var(--line-strong); background:var(--surface);
  border-radius:var(--r-sm); padding:0 34px 0 14px; font-size:15px; font-weight:600; color:var(--ink)}
#city:focus{border-color:var(--green)}
.countbar{display:flex; align-items:center; justify-content:space-between; padding:10px 20px 4px}
.count{font-size:13.5px; color:var(--muted); font-weight:600}
.count b{color:var(--ink)}
.clearall{border:0; background:transparent; color:var(--green-btn); font-weight:700; font-size:13.5px; padding:6px 8px; border-radius:8px; display:none}
.clearall.show{display:inline-block}
.clearall:hover{background:var(--green-soft)}

/* ---------------- LIST ---------------- */
.list{padding:6px 16px 40px; display:flex; flex-direction:column; gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 16px 14px;
  box-shadow:var(--shadow-card); position:relative; transition:transform .12s var(--ease), box-shadow .18s, border-color .18s}
.card:active{transform:scale(.985)}
.card .spec{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  color:var(--green-ink); background:var(--green-soft); border:1px solid var(--green-line);
  padding:3px 9px; border-radius:var(--r-pill); margin-bottom:9px}
.card h3{font-family:var(--serif); font-weight:600; font-size:19px; line-height:1.18; margin:0 0 5px; letter-spacing:-.01em; color:var(--ink)}
.card .loc{font-size:14px; color:var(--muted); display:flex; align-items:center; gap:6px}
.card .loc svg{width:14px;height:14px;color:var(--faint);flex:none}
.card .crm{font-size:11.5px; color:var(--faint); margin-top:5px; font-weight:500}
.wa-badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 10px; border-radius:var(--r-pill); margin:12px 0 10px}
.wa-badge svg{width:13px;height:13px}
.wa-badge.ok{background:var(--green-soft); color:var(--green-ink); border:1px solid var(--green-line)}
.wa-badge.maybe{background:var(--teal-soft); color:var(--teal); border:1px solid #b6dee1}
.wa-badge.fixo{background:var(--amber-soft); color:var(--amber); border:1px solid var(--amber-line)}
.btn-wa{width:100%; height:50px; border:0; border-radius:var(--r-sm); background:var(--wa); color:#fff;
  font-size:15.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:9px;
  box-shadow:0 2px 8px #0a7d5533; transition:transform .1s var(--ease), background .15s}
.btn-wa:active{transform:scale(.98)}
.btn-wa:hover{background:#08694a}
.btn-wa svg{width:20px;height:20px}
.btn-wa.call{background:var(--surface); color:var(--green-ink); border:1.5px solid var(--green-line); box-shadow:none}
.btn-wa.call:hover{background:var(--green-soft)}

/* skeleton */
.skel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow-card)}
.skel div{background:linear-gradient(90deg,#eef2ef 25%,#e2e9e4 37%,#eef2ef 63%); background-size:400% 100%;
  animation:sh 1.3s infinite linear; border-radius:6px; height:12px; margin-bottom:9px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* empty */
.empty{text-align:center; padding:56px 24px; color:var(--muted)}
.empty .ico{width:60px;height:60px;margin:0 auto 14px; border-radius:50%; background:var(--green-soft); display:grid; place-items:center; color:var(--green)}
.empty .ico svg{width:28px;height:28px}
.empty h3{font-family:var(--serif); color:var(--ink); font-size:20px; margin:0 0 6px; font-weight:600}
.empty p{margin:0 0 16px; font-size:14.5px}
.empty .did{color:var(--green-btn); font-weight:700}
.empty button{height:46px;padding:0 22px;border-radius:var(--r-pill);border:1.5px solid var(--green-line);
  background:var(--surface); color:var(--green-ink); font-weight:700; font-size:14.5px}
.sentinel{height:1px}

/* ============================ SHEETS / MODAL ============================ */
.scrim{position:fixed; inset:0; background:rgba(14,28,22,.42); backdrop-filter:blur(2px); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .25s}
.scrim.show{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:100%; max-width:560px; z-index:50;
  background:var(--surface); border-radius:22px 22px 0 0; box-shadow:var(--shadow-sheet);
  max-height:92dvh; display:flex; flex-direction:column; transition:transform .3s var(--ease)}
.sheet.show{transform:translate(-50%,0)}
.grip{width:42px;height:5px;border-radius:99px;background:var(--line-strong);margin:10px auto 4px;flex:none}
.sheet .x{position:absolute; top:12px; right:14px; width:38px;height:38px;border:0;background:var(--bg);border-radius:50%;
  color:var(--muted); font-size:20px; display:grid; place-items:center; z-index:2}
.sheet .x:hover{background:var(--green-soft);color:var(--green-ink)}
.sheet-body{overflow-y:auto; padding:8px 22px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch}

/* detail */
#detail .spec{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  color:var(--green-ink); background:var(--green-soft); border:1px solid var(--green-line); padding:3px 9px; border-radius:var(--r-pill)}
#detail h2{font-family:var(--serif); font-weight:600; font-size:26px; line-height:1.14; margin:12px 0 2px; letter-spacing:-.01em}
#detail .dcrm{font-size:13px;color:var(--faint); font-weight:500; margin-bottom:18px}
.field{border-top:1px solid var(--line); padding:15px 0}
.field .lab{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:700; margin-bottom:5px}
.field .val{font-size:15.5px; color:var(--ink); font-weight:500}
.linkbtn{display:inline-flex;align-items:center;gap:7px;margin-top:10px;height:42px;padding:0 16px;border-radius:var(--r-sm);
  border:1.5px solid var(--line-strong); background:var(--surface); color:var(--green-ink); font-weight:700; font-size:14px; text-decoration:none}
.linkbtn:hover{background:var(--green-soft);border-color:var(--green-line)}
.linkbtn svg{width:16px;height:16px}
.telrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.telrow .n{font-size:15.5px;font-weight:600}
.sheet-foot{padding:14px 22px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--surface)}

/* message modal */
#msg .to{font-size:14px;color:var(--muted);margin:2px 0 16px}
#msg .to b{color:var(--ink)}
.qchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchip{flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);border:1.5px solid var(--line-strong);
  background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink)}
.qchip[aria-pressed="true"]{background:var(--green-ink);border-color:var(--green-ink);color:#fff}
#msgText{width:100%;min-height:150px;border:1.5px solid var(--line-strong);border-radius:14px;padding:14px;
  font-size:16px;line-height:1.5;color:var(--ink);resize:vertical;background:#fbfdfc}
#msgText:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 4px var(--green-soft)}
.charc{text-align:right;font-size:12px;color:var(--faint);margin-top:6px;min-height:16px}
.savepref{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted);font-weight:500}
.savepref input{width:20px;height:20px;accent-color:var(--green)}
.warn{background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:500;margin-top:14px;display:none}
.warn.show{display:block}
.foot2{display:flex;gap:10px;margin-top:16px}
.btn-ghost{flex:1;height:52px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--muted);font-weight:700;font-size:15px}
.btn-ghost:hover{background:var(--bg)}
.btn-primary{flex:2;height:52px;border-radius:14px;border:0;background:var(--wa);color:#fff;font-weight:700;font-size:15.5px;
  display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 3px 12px #0a7d5540}
.btn-primary:hover{background:#08694a}
.btn-primary svg{width:19px;height:19px}

/* full-list specialty picker */
#specSheet .search2{position:sticky;top:0;background:var(--surface);padding:4px 0 12px}
#specSearch{width:100%;height:46px;border:1.5px solid var(--line-strong);border-radius:var(--r-pill);padding:0 16px;font-size:16px}
#specSearch:focus{border-color:var(--green);outline:none}
.speclist{display:flex;flex-direction:column}
.specitem{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-top:1px solid var(--line);
  font-size:16px;font-weight:600;color:var(--ink);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.specitem:hover{color:var(--green-ink)}
.specitem .c{font-size:13px;color:var(--faint);font-weight:600}

.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header id="hd">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>Guia Médico Fácil</h1>
        <div class="sub"><b id="genDate">atualizado</b> · ferramenta pessoal, não oficial</div>
      </div>
    </div>
    <div class="search">
      <svg class="lupa" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Buscar médico ou especialidade" aria-label="Buscar médico ou especialidade">
      <button class="clearq" id="clearq" aria-label="Limpar busca">×</button>
    </div>
  </header>

  <div class="filters">
    <div class="chips" id="specChips" role="group" aria-label="Filtrar por especialidade"></div>
    <div class="rowtools">
      <div class="selwrap">
        <select id="city" aria-label="Filtrar por cidade"></select>
        <svg viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="countbar">
      <span class="count" id="count"></span>
      <button class="clearall" id="clearall">Limpar filtros</button>
    </div>
  </div>

  <div class="list" id="list" aria-live="polite"></div>
  <div class="sentinel" id="sentinel"></div>
</div>

<!-- scrim + sheets -->
<div class="scrim" id="scrim"></div>

<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-label="Detalhes do médico">
  <div class="grip"></div>
  <button class="x" data-close aria-label="Fechar">×</button>
  <div class="sheet-body" id="detailBody"></div>
  <div class="sheet-foot" id="detailFoot"></div>
</section>

<section class="sheet" id="msg" role="dialog" aria-modal="true" aria-label="Enviar mensagem">
  <div class="grip"></div>
  <button class="x" data-close aria-label="Fechar">×</button>
  <div class="sheet-body">
    <h2 style="font-family:var(--serif);font-weight:600;font-size:22px;margin:6px 0 2px">Enviar mensagem</h2>
    <div class="to" id="msgTo"></div>
    <div class="qchips" id="qchips" role="group" aria-label="Modelos de mensagem"></div>
    <textarea id="msgText" aria-label="Texto da mensagem"></textarea>
    <div class="charc" id="charc"></div>
    <div class="warn" id="msgWarn"></div>
    <label class="savepref"><input type="checkbox" id="savePref"> Salvar como minha mensagem padrão</label>
    <div class="foot2">
      <button class="btn-ghost" data-close>Cancelar</button>
      <a class="btn-primary" id="sendBtn" href="#" target="_blank" rel="noopener" role="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.1.1.3 0 .5-.1.2-.2.3-.3.5l-.4.4c-.2.2-.3.3-.1.6.2.3.9 1.4 1.9 2.3 1.3 1.1 2.3 1.5 2.6 1.6.3.1.4.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.7.9.2.1.4.2.4.3.1.1.1.6-.1 1.2Z"/></svg>
        Abrir WhatsApp
      </a>
    </div>
  </div>
</section>

<section class="sheet" id="specSheet" role="dialog" aria-modal="true" aria-label="Todas as especialidades">
  <div class="grip"></div>
  <button class="x" data-close aria-label="Fechar">×</button>
  <div class="sheet-body">
    <h2 style="font-family:var(--serif);font-weight:600;font-size:22px;margin:6px 0 8px">Especialidades</h2>
    <div class="search2"><input id="specSearch" type="search" placeholder="Buscar especialidade" aria-label="Buscar especialidade"></div>
    <div class="speclist" id="speclist"></div>
  </div>
</section>

<script>
/* =========================================================================
   DADOS embutidos (gerados de medicos.json). Para migrar p/ Next.js+Supabase,

/* ---------- util ---------- */
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const titleCase = s => (s||"").toLowerCase().replace(/(^|\s|')([a-zà-ú])/g,(m,p,c)=>p+c.toUpperCase());
function primeiroUltimo(nome){
  const parts = (nome||"").trim().split(/\s+/).filter(w=>w.length>1);
  if(!parts.length) return titleCase(nome);
  if(parts.length===1) return titleCase(parts[0]);
  return titleCase(parts[0]+" "+parts[parts.length-1]);
}
const el = (id)=>document.getElementById(id);

/* cidade "casa": abre nela por padrão (Londrina) e lembra a escolha do usuário.
   localStorage funciona hospedado; se bloqueado (ex: sandbox), cai p/ Londrina em memória. */
const CITY_KEY='gm_cidade';
function loadCity(){ try{ return localStorage.getItem(CITY_KEY)||'LONDRINA'; }catch(e){ return 'LONDRINA'; } }
function saveCity(c){ try{ if(c) localStorage.setItem(CITY_KEY,c); }catch(e){} }

/* ---------- init ---------- */
function init(){
  el('genDate').textContent = GEN_DATE ? ("atualizado em "+GEN_DATE) : "guia médico";
  buildCities();
  buildSpecChips();
  buildSpecSheet();
  buildQuickChips();
  wire();

}

/* cidades ordenadas por volume (Londrina 1º) */
function buildCities(){
  const cnt={};
  MEDICOS.forEach(m=>{ if(m.cidade) cnt[m.cidade]=(cnt[m.cidade]||0)+1; });
  const cities=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const sel=el('city');
  sel.innerHTML='<option value="">Todas as cidades</option>'+
    cities.map(c=>`<option value="${c}">${titleCase(c)} (${cnt[c]})</option>`).join('');
  if(!cities.includes(fCity)){ fCity = cities.includes('LONDRINA')?'LONDRINA':''; homeCity=fCity; }
  sel.value = fCity;
}

/* chips: 8 especialidades mais comuns + "Ver todas" */
let ALL_SPECS=[];
function buildSpecChips(){
  const cnt={};
  MEDICOS.forEach(m=>{ if(m.especialidade) cnt[m.especialidade]=(cnt[m.especialidade]||0)+1; });
  ALL_SPECS=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const top=ALL_SPECS.slice(0,8);
  const wrap=el('specChips');
  wrap.innerHTML =
    `<button class="chip" data-spec="" aria-pressed="true">Todas</button>` +
    top.map(s=>`<button class="chip" data-spec="${s}" aria-pressed="false">${titleCase(s)}</button>`).join('') +
    `<button class="chip more" id="verTodas">Ver todas ▾</button>`;
  wrap.querySelectorAll('.chip[data-spec]').forEach(b=>{
    b.addEventListener('click',()=>{ fSpec=b.dataset.spec; syncChips(); applyFilters(); el('specChips').scrollTo({left:0,behavior:'smooth'}); });
  });
  el('verTodas').addEventListener('click',()=>openSheet('specSheet'));
}
function syncChips(){
  el('specChips').querySelectorAll('.chip[data-spec]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.spec===fSpec)));
}

function buildSpecSheet(){
  const cnt={};
  MEDICOS.forEach(m=>{ if(m.especialidade) cnt[m.especialidade]=(cnt[m.especialidade]||0)+1; });
  const alpha=[...ALL_SPECS].sort((a,b)=>a.localeCompare(b,'pt'));
  const list=el('speclist');
  const render=(term="")=>{
    const t=norm(term);
    list.innerHTML=alpha.filter(s=>norm(s).includes(t)).map(s=>
      `<button class="specitem" data-spec="${s}"><span>${titleCase(s)}</span><span class="c">${cnt[s]}</span></button>`).join('');
    list.querySelectorAll('.specitem').forEach(b=>b.addEventListener('click',()=>{
      fSpec=b.dataset.spec; syncChips(); rebuildTopChip(); applyFilters(); closeSheet();
    }));
  };
  render();
  el('specSearch').addEventListener('input',e=>render(e.target.value));
}
/* se escolher uma especialidade fora do top-8, injeta um chip ativo */
function rebuildTopChip(){
  const wrap=el('specChips');
  if(fSpec && !wrap.querySelector(`.chip[data-spec="${CSS.escape(fSpec)}"]`)){
    const b=document.createElement('button');
    b.className='chip'; b.dataset.spec=fSpec; b.textContent=titleCase(fSpec);
    b.addEventListener('click',()=>{ fSpec=b.dataset.spec; syncChips(); applyFilters(); });
    wrap.insertBefore(b, el('verTodas'));
  }
  syncChips();
}

function buildQuickChips(){
  el('qchips').innerHTML=Object.entries(QUICK).map(([k,v])=>
    `<button class="qchip" data-q="${k}" aria-pressed="${k==='agendar'}">${v.label}</button>`).join('');
  el('qchips').querySelectorAll('.qchip').forEach(b=>b.addEventListener('click',()=>{
    currentQuick=b.dataset.q;
    el('qchips').querySelectorAll('.qchip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    const n=primeiroUltimo(currentDoctor.nome);
    el('msgText').value=QUICK[currentQuick].text(n);
    updateChar(); refreshWaHref();
  }));
}

/* ---------- filtering ---------- */
function applyFilters(){
  const q=norm(fQ);
  filtered=MEDICOS.filter(m=>{
    if(fSpec && m.especialidade!==fSpec) return false;
    if(fCity && m.cidade!==fCity) return false;
    if(q){
      const hay=norm(m.nome+" "+m.especialidade+" "+(m.bairro||"")+" "+(m.cidade||""));
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  el('count').innerHTML=`<b>${filtered.length}</b> ${filtered.length===1?'médico encontrado':'médicos encontrados'}`;
  const anyFilter = fSpec || fQ || (fCity!==homeCity);
  el('clearall').classList.toggle('show', !!anyFilter);
  rendered=0;
  const list=el('list'); list.innerHTML="";
  if(!filtered.length){ renderEmpty(); return; }
  renderMore();
}
function renderMore(){
  const list=el('list');
  const slice=filtered.slice(rendered, rendered+PAGE);
  const frag=document.createDocumentFragment();
  slice.forEach(m=>frag.appendChild(cardEl(m)));
  list.appendChild(frag);
  rendered+=slice.length;
}

function badge(m){
  if(m.whatsapp_status==='confirmado') return `<span class="wa-badge ok">${CHECK_SVG} WhatsApp confirmado no guia</span>`;
  if(m.whatsapp_status==='provavel') return `<span class="wa-badge maybe">${WA_SVG} Celular · provável WhatsApp</span>`;
  return `<span class="wa-badge fixo">${PHONE_SVG} Telefone fixo · confirme o WhatsApp</span>`;
}
function cardEl(m){
  const c=document.createElement('article');
  c.className='card'; c.tabIndex=0; c.setAttribute('role','button');
  c.setAttribute('aria-label',`Ver ${titleCase(m.nome)}, ${titleCase(m.especialidade)}`);
  c.innerHTML=`
    <span class="spec">${titleCase(m.especialidade)}</span>
    <h3>${titleCase(m.nome)}</h3>
    <div class="loc">${PIN_SVG}<span>${m.bairro?titleCase(m.bairro)+' · ':''}${titleCase(m.cidade||'')}</span></div>
    <div class="crm">${m.crm?('CRM '+m.crm):''}</div>
    ${badge(m)}
    <button class="btn-wa" aria-label="Chamar ${titleCase(m.nome)} no WhatsApp">${WA_SVG} Chamar no WhatsApp</button>`;
  c.addEventListener('click',()=>openDetail(m));
  c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(m);} });
  const btn=c.querySelector('.btn-wa');
  btn.addEventListener('click',e=>{ e.stopPropagation(); openMsg(m); });
  return c;
}

  const dy=el('didyou'); if(dy) dy.addEventListener('click',()=>{ const g=ALL_SPECS.find(s=>norm(s).startsWith(norm(t).slice(0,4))); fQ="";el('q').value="";el('clearq').classList.remove('show'); fSpec=g; rebuildTopChip(); applyFilters(); });
  el('emptyClear').addEventListener('click',clearAll);

/* ---------- message modal ---------- */
function openMsg(m, fromDetail){
  currentDoctor=m; currentQuick='agendar';
  el('qchips').querySelectorAll('.qchip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.q==='agendar')));
  el('msgTo').innerHTML=`Para: <b>Dr(a). ${titleCase(m.nome)}</b> — ${titleCase(m.especialidade)}`;
  const n=primeiroUltimo(m.nome);
  el('msgText').value = sessionDefaultMsg ? sessionDefaultMsg.replace('{n}',n) : QUICK.agendar.text(n);
  el('savePref').checked=false;
  updateChar();
  // aviso de fixo
  const warn=el('msgWarn');
  const digits=(m.whatsapp_numero||'').replace(/\D/g,'');
  if(m.whatsapp_status==='fixo'){
    warn.innerHTML=`Este número (${m.telefones[0]||''}) parece ser um <b>telefone fixo</b> — o WhatsApp pode não abrir. Se preferir, <a href="tel:+55${digits}" style="color:var(--amber);font-weight:700">ligue diretamente</a>.`;
    warn.classList.add('show');
  } else { warn.classList.remove('show'); }
  refreshWaHref();                       // deixa o href do <a> pronto p/ toque direto
  if(fromDetail){ closeSheet(true); }   // fecha detalhe silenciosamente, abre msg
  openSheet('msg');
}
function updateChar(){
  const v=el('msgText').value, c=el('charc');
  c.textContent = v.length>300 ? `${v.length} caracteres` : '';
}
/* o botão "Abrir WhatsApp" é um <a>: mantemos o href sincronizado com o texto atual,
   pra que o TOQUE DIRETO do usuário abra o wa.me (máxima compatibilidade em ambiente hospedado). */
function refreshWaHref(){
  const m=currentDoctor; if(!m) return;
  const digits=(m.whatsapp_numero||'').replace(/\D/g,'');
  el('sendBtn').href = digits.length>=10
    ? `https://wa.me/55${digits}?text=${encodeURIComponent(el('msgText').value)}`
    : '#';
}
function onSendClick(e){
  const m=currentDoctor; if(!m){ e.preventDefault(); return; }
  const digits=(m.whatsapp_numero||'').replace(/\D/g,'');
  if(digits.length<10){                  // número quebrado no guia: não navega
    e.preventDefault();
    el('msgWarn').innerHTML='Número inválido ou incompleto no guia. Confira no PDF original.';
    el('msgWarn').classList.add('show'); return;
  }
  if(el('savePref').checked){
    const n=primeiroUltimo(m.nome);
    sessionDefaultMsg=el('msgText').value.split(n).join('{n}');  // template p/ próximos médicos
  }
  window.__lastWa=el('sendBtn').href;    // hook p/ testes
  closeSheet();                          // deixa a navegação nativa do <a> seguir (target=_blank)
}

function openSheet(id){
  const s=el(id);
  el('scrim').classList.add('show');
  s.classList.add('show');
  openStack.push(id);
  try{ history.pushState({sheet:id},''); }catch(e){}
  // focus
  setTimeout(()=>{ const f=s.querySelector('[data-close],button,a,input'); if(f) f.focus(); },60);
  document.body.style.overflow='hidden';
}
function closeSheet(silent){
  const id=openStack.pop();
  if(id) el(id).classList.remove('show');
  if(!openStack.length){ el('scrim').classList.remove('show'); document.body.style.overflow=''; }
  try{ if(!silent && history.state && history.state.sheet){ history.back(); } }catch(e){}
}
window.addEventListener('popstate',()=>{
  if(openStack.length){ const id=openStack.pop(); el(id).classList.remove('show');
    if(!openStack.length){ el('scrim').classList.remove('show'); document.body.style.overflow=''; } }
});

/* ---------- wiring ---------- */
function clearAll(){ fSpec="";fCity=homeCity;fQ=""; el('q').value="";el('clearq').classList.remove('show'); el('city').value=homeCity; syncChips(); applyFilters(); }
function showSkeleton(){ el('list').innerHTML=Array(4).fill('<div class="skel"><div style="width:35%"></div><div style="width:70%"></div><div style="width:50%"></div><div style="width:100%;height:44px;margin-top:10px"></div></div>').join(''); }
let qTimer;
function wire(){
  el('q').addEventListener('input',e=>{
    el('clearq').classList.toggle('show', !!e.target.value);
    clearTimeout(qTimer); qTimer=setTimeout(()=>{ fQ=e.target.value; applyFilters(); },200);
  });
  el('clearq').addEventListener('click',()=>{ el('q').value="";fQ="";el('clearq').classList.remove('show');applyFilters();el('q').focus(); });
  el('city').addEventListener('change',e=>{ fCity=e.target.value; if(fCity){ homeCity=fCity; saveCity(fCity); } applyFilters(); });
  el('clearall').addEventListener('click',clearAll);
  el('msgText').addEventListener('input',()=>{ updateChar(); refreshWaHref(); });
  el('sendBtn').addEventListener('click',onSendClick);
  el('scrim').addEventListener('click',()=>{ while(openStack.length) closeSheet(); });
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeSheet()));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&openStack.length) closeSheet(); });
  // header shadow on scroll
  window.addEventListener('scroll',()=>{ el('hd').classList.toggle('scrolled', window.scrollY>4); },{passive:true});
  // infinite scroll
  new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting && rendered<filtered.length) renderMore(); }); },{rootMargin:'600px'}).observe(el('sentinel'));
}

init();
</script>
